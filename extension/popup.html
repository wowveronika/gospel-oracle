<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Исповедь</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="screen">
      <!-- Крест из двух вертикальных и двух горизонтальных полос прокрутки -->
      <svg class="cross" viewBox="0 0 100 170" aria-hidden="true">
        <defs>
          <linearGradient id="track-v" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#e2e2e2" />
            <stop offset="0.5" stop-color="#ffffff" />
            <stop offset="1" stop-color="#e2e2e2" />
          </linearGradient>
          <linearGradient id="track-h" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#e2e2e2" />
            <stop offset="0.5" stop-color="#ffffff" />
            <stop offset="1" stop-color="#e2e2e2" />
          </linearGradient>
          <linearGradient id="thumb-v" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#2a63c9" />
            <stop offset="0.35" stop-color="#bfe0ff" />
            <stop offset="0.6" stop-color="#4f97ec" />
            <stop offset="1" stop-color="#2a63c9" />
          </linearGradient>
          <linearGradient id="thumb-h" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0" stop-color="#2a63c9" />
            <stop offset="0.35" stop-color="#bfe0ff" />
            <stop offset="0.6" stop-color="#4f97ec" />
            <stop offset="1" stop-color="#2a63c9" />
          </linearGradient>
        </defs>

        <!-- горизонтальные полосы -->
        <rect class="bar" x="0" y="52" width="100" height="9" fill="url(#track-h)" />
        <rect class="bar" x="0" y="61" width="100" height="9" fill="url(#track-h)" />
        <rect class="thumb" x="3" y="53.5" width="24" height="6" rx="3" fill="url(#thumb-h)" />
        <rect class="thumb" x="60" y="62.5" width="22" height="6" rx="3" fill="url(#thumb-h)" />
        <path class="arrow" d="M85 56.5 l3 -2 v4 z M91 54.5 l3 2 l-3 2 z M85 65.5 l3 -2 v4 z M91 63.5 l3 2 l-3 2 z" />
        <path class="grip" d="M96 60 l3 -3 M98 60 l1 -1 M96 69 l3 -3 M98 69 l1 -1" />

        <!-- вертикальные полосы -->
        <rect class="bar" x="41" y="0" width="9" height="170" fill="url(#track-v)" />
        <rect class="bar" x="50" y="0" width="9" height="170" fill="url(#track-v)" />
        <rect class="thumb" x="42.5" y="3" width="6" height="42" rx="3" fill="url(#thumb-v)" />
        <rect class="thumb" x="51.5" y="98" width="6" height="50" rx="3" fill="url(#thumb-v)" />
        <path class="arrow" d="M43.5 156 l2 -3 l2 3 z M43.5 158 l2 3 l2 -3 z M52.5 156 l2 -3 l2 3 z M52.5 158 l2 3 l2 -3 z" />
        <path class="grip" d="M45 169 l4 -4 M47 169 l2 -2 M54 169 l4 -4 M56 169 l2 -2" />
      </svg>

      <header>
        <h1>Исповедь</h1>
        <p id="site" class="muted">…</p>
      </header>

      <!-- Картинка: стопка пустых окон -->
      <svg class="windows" viewBox="0 0 200 150" fill="#fff" stroke="#111" stroke-width="0.8"
        stroke-linejoin="miter" shape-rendering="crispEdges" aria-hidden="true">
        <g id="window">
          <rect x="0" y="0" width="150" height="96" />
          <line x1="0" y1="10" x2="150" y2="10" />
          <rect x="3" y="3" width="4" height="4" />
          <rect x="9" y="3" width="4" height="4" />
          <rect x="15" y="3" width="4" height="4" />
        </g>
        <use href="#window" x="6" y="6" />
        <use href="#window" x="12" y="12" />
        <use href="#window" x="18" y="18" />
        <use href="#window" x="24" y="24" />
        <use href="#window" x="30" y="30" />
        <use href="#window" x="36" y="36" />
        <use href="#window" x="42" y="42" />
      </svg>

      <section class="scale">
        <p class="total"><span id="total">0</span> <span id="total-word">грехов</span></p>
        <div id="bars"></div>
      </section>

      <section id="verse-block" class="verse">
        <p id="verse">…</p>
        <p id="ref" class="muted"></p>
        <button id="next" type="button">другой стих</button>
      </section>
    </div>

    <!-- Фильтр для волнистого глитча -->
    <svg class="filters" aria-hidden="true">
      <filter id="wave">
        <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.001 0.09" numOctaves="1" seed="1" />
        <feDisplacementMap id="displace" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="B" />
      </filter>
    </svg>

    <script src="data.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
